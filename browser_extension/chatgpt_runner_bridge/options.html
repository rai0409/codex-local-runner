<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>ChatGPT Runner Bridge Options</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 24px;
        max-width: 720px;
      }
      label {
        display: block;
        font-weight: 600;
        margin-bottom: 8px;
      }
      input {
        box-sizing: border-box;
        font: inherit;
        padding: 8px;
        width: 100%;
      }
      button {
        font: inherit;
        margin-top: 12px;
        padding: 8px 12px;
      }
      #status {
        margin-top: 12px;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <label for="bridgeBaseUrl">Bridge base URL</label>
    <input id="bridgeBaseUrl" type="url" value="http://127.0.0.1:8765">
    <button id="save">Save</button>
    <button id="health">Health Check</button>
    <div id="status"></div>
    <script src="options.js"></script>
  </body>
</html>
